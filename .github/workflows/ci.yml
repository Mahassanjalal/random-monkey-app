name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy
          POSTGRES_DB: buddy
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://buddy:buddy@localhost:5432/buddy?schema=public
      REDIS_URL: redis://localhost:6379
      REDIS_ENABLED: true
      JWT_SECRET: ci-insecure-jwt-secret-do-not-use-in-production
      CORS_ORIGINS: http://localhost:4000
      TURN_SECRET: ci-turn-secret-do-not-use-in-production
      ICE_SERVERS: stun:stun.l.google.com:19302
      MODERATION_PROVIDER: none
      PAYMENTS_PROVIDER: DISABLED

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build shared contracts
        run: npm run build:shared

      - name: Generate Prisma client (Postgres dialect)
        working-directory: backend
        run: |
          sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Backend tests
        run: npm run test:backend

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

      - name: Push database schema
        working-directory: backend
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate

      - name: Start backend and run smoke test
        run: |
          npm run start --workspace backend &
          BACKEND_PID=$!
          # Wait for backend to be ready (up to 60 seconds)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:${PORT}/health/live > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          # Run smoke test
          npm run smoke
          EXIT_CODE=$?
          # Stop the backend server
          kill $BACKEND_PID 2>/dev/null || true
          wait $BACKEND_PID 2>/dev/null || true
          exit $EXIT_CODE
